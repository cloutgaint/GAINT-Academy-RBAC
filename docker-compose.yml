services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gaint_academy
      POSTGRES_USER: gaint
      POSTGRES_PASSWORD: gaint_dev_password
    ports:
      - "5432:5432"
    volumes:
      - gaint_academy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaint -d gaint_academy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://gaint:gaint_dev_password@db:5432/gaint_academy
      SECRET_KEY: replace-in-production
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  gaint_academy_pg:
